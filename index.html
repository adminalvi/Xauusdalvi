<!DOCTYPE html>
<html>
<head>
<title>XAUUSD ADVANCE FUTURE - SHAHZAIN</title>
<style>
body {margin:0; background:#000; color:#fff; font-family:Arial; overflow:hidden;}
.watermark {position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:280px; color:#00ff88; opacity:0.02; z-index:0; font-weight:900;}
#tvchart {height:100vh!important; width:100%!important; position:absolute; top:0; left:0; z-index:1;}
.panel {position:fixed; top:15px; right:15px; background:#0a0a0a; border:3px solid #00ff88; padding:20px; z-index:2; border-radius:15px; width:300px;}
.panel h2 {color:#00ff88; text-align:center; margin:0 0 15px 0;}
.zone {padding:12px; margin:8px 0; border-radius:8px; font-weight:bold; font-size:14px;}
.buy {background:rgba(0,255,136,0.2); border-left:5px solid #00ff88;}
.sell {background:rgba(255,0,68,0.2); border-left:5px solid #ff0044;}
.alert {padding:15px; background:#111; margin-top:10px; border-radius:10px; text-align:center; font-size:16px; font-weight:900;}
</style>
</head>
<body>
<div class="watermark">SHAHZAIN</div>

<div class="panel">
  <h2>ADVANCE FUTURE DASHBOARD</h2>
  <div class="zone buy">BUY ZONE: 4600 - 4619</div>
  <div class="zone sell">SELL ZONE: 4736 - 4755</div>
  <div class="alert" id="price">PRICE: --</div>
  <div class="alert" id="rsi">RSI: --</div>
  <div class="alert" id="signal">SCANNING H4...</div>
</div>

<div id="tvchart"></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
var widget = new TradingView.widget({
"width": "100%", "height": "100%", "symbol": "OANDA:XAUUSD",
"interval": "240", "range": "12M", "timezone": "Asia/Karachi",
"theme": "dark", "style": "1", "container_id": "tvchart",
"studies": ["RSI@tv-basicstudies"]
});

widget.onChartReady(function() {
  // BARE GREEN BOX BUY ZONE
  widget.chart().createShape({time: widget.chart().getVisibleRange().from, price: 4619},
  {shape: "rectangle", text: "BUY LIQUIDITY ZONE",
   overrides: {backgroundColor: "rgba(0,255,136,0.3)", borderColor: "#00ff88", borderWidth: 4}});

  // BARE RED BOX SELL ZONE 
  widget.chart().createShape({time: widget.chart().getVisibleRange().from, price: 4755},
  {shape: "rectangle", text: "SELL LIQUIDITY ZONE",
   overrides: {backgroundColor: "rgba(255,0,68,0.3)", borderColor: "#ff0044", borderWidth: 4}});
});

// LIVE SCANNER
setInterval(function(){
  try{
    var data = widget.chart().getData();
    var price = data.lastBarClosePrice;
    var rsi = data.studies[0].lastValue;
    if(price){
      document.getElementById("price").innerHTML = "PRICE: " + price.toFixed(2);
      document.getElementById("rsi").innerHTML = "RSI: " + rsi.toFixed(2);
      
      if(price <= 4619 && price >= 4600 && rsi < 30){
        document.getElementById("signal").innerHTML = "BUY SWEEP ALERT!";
        document.getElementById("signal").style.background = "#00ff88";
        document.getElementById("signal").style.color = "#000";
      }
      else if(price >= 4736 && price <= 4755 && rsi > 70){
        document.getElementById("signal").innerHTML = "SELL SWEEP ALERT!";
        document.getElementById("signal").style.background = "#ff0044";
      }
      else if(price > 4755){
        document.getElementById("signal").innerHTML = "BREAKOUT UP!";
        document.getElementById("signal").style.background = "#00ff88";
        document.getElementById("signal").style.color = "#000";
      }
      else if(price < 4600){
        document.getElementById("signal").innerHTML = "BREAKDOWN!";
        document.getElementById("signal").style.background = "#ff0044";
      }
    }
  }catch(e){}
}, 2000);
</script>
</body>
</html>
