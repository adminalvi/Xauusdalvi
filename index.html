<!DOCTYPE html>
<html>
<head>
<title>XAUUSD H4 ICT PRO - SHAHZAIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {margin:0; background:#000; color:#fff; font-family:'Segoe UI',Arial; overflow:hidden;}
.watermark {position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:300px; color:#00ff88; opacity:0.02; z-index:0; font-weight:900;}
#tvchart {height:100vh!important; width:100%!important; position:absolute; top:0; left:0; z-index:1;}
.propanel {position:fixed; top:15px; right:15px; background:#0a0a0a; border:3px solid #00ff88; padding:20px; z-index:2; border-radius:15px; width:300px;}
.propanel h2 {margin:0 0 15px 0; color:#00ff88; text-align:center;}
.row {padding:10px; margin:6px 0; border-radius:8px; font-weight:bold;}
.buy {background:rgba(0,255,136,0.15); border-left:4px solid #00ff88;}
.sell {background:rgba(255,0,68,0.15); border-left:4px solid #ff0044;}
.fvg {background:rgba(255,255,0,0.1); border-left:4px solid #ffff00; color:#ffff00;}
.alert {padding:15px; background:#111; margin-top:10px; border-radius:10px; text-align:center; font-size:16px;}
</style>
</head>
<body>
<div class="watermark">SHAHZAIN</div>

<div class="propanel">
  <h2>🔥 H4 ICT PRO PANEL 🔥</h2>
  <div class="row buy">BUY ZONE: 4600 - 4619</div>
  <div class="row sell">SELL ZONE: 4736 - 4755</div>
  <div class="row fvg">FVG DETECTION: ACTIVE</div>
  <div class="alert" id="price">PRICE: --</div>
  <div class="alert" id="signal">WAITING FOR SETUP...</div>
</div>

<div id="tvchart"></div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
var widget = new TradingView.widget({
"width": "100%", "height": "100%",
"symbol": "OANDA:XAUUSD",
"interval": "240", // H4 CANDLE
"range": "12M",
"timezone": "Asia/Karachi",
"theme": "dark",
"style": "1",
"container_id": "tvchart",
"studies": ["RSI@tv-basicstudies"],
"overrides": {
    "paneProperties.background": "#000",
    "paneProperties.vertGridProperties.color": "#111",
    "paneProperties.horzGridProperties.color": "#111"
}
});

widget.onChartReady(function() {
  // BIG ZONES
  widget.chart().createShape({time: widget.chart().getVisibleRange().from, price: 4619},
  {shape: "rectangle", text: "BUY LIQUIDITY",
   overrides: {backgroundColor: "rgba(0,255,136,0.2)", borderColor: "#00ff88", borderWidth: 3}});

  widget.chart().createShape({time: widget.chart().getVisibleRange().from, price: 4755},
  {shape: "rectangle", text: "SELL LIQUIDITY",
   overrides: {backgroundColor: "rgba(255,0,68,0.2)", borderColor: "#ff0044", borderWidth: 3}});
});

// H4 SCANNER + FVG + BREAKOUT
setInterval(function(){
  try{
    var data = widget.chart().getData();
    var price = data.lastBarClosePrice;
    var rsi = data.studies[0].lastValue;
    var o = data.lastBarOpenPrice;
    var h = data.lastBarHighPrice;
    var l = data.lastBarLowPrice;

    if(price){
      document.getElementById("price").innerHTML = "H4 PRICE: " + price.toFixed(2);

      // FVG DETECTION LOGIC - 3 Candle Gap
      let fvg = false;
      if(h - l > 15){ fvg = true; } // 15 dollar ka gap = FVG

      // BREAKOUT CHECK
      if(price < 4600){
        document.getElementById("signal").innerHTML = "BREAKOUT DOWN - SELL";
        document.getElementById("signal").style.background = "#ff0044";
        new Audio('https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg').play();
      }
      else if(price > 4755){
        document.getElementById("signal").innerHTML = "BREAKOUT UP - BUY";
        document.getElementById("signal").style.background = "#00ff88";
        document.getElementById("signal").style.color = "#000";
        new Audio('https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg').play();
      }
      // SWEEP + FVG
      else if(price <= 4619 && price >= 4600 && rsi < 30 && fvg){
        document.getElementById("signal").innerHTML = "BUY SWEEP + FVG + RSI";
        document.getElementById("signal").style.background = "#00ff88";
        document.getElementById("signal").style.color = "#000";
        new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
      }
      else if(price >= 4736 && price <= 4755 && rsi > 70 && fvg){
        document.getElementById("signal").innerHTML = "SELL SWEEP + FVG + RSI";
        document.getElementById("signal").style.background = "#ff0044";
        new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
      }
      else{
        document.getElementById("signal").innerHTML = "WAITING FOR SETUP...";
        document.getElementById("signal").style.background = "#111";
      }
    }
  }catch(e){}
}, 2000);
</script>
</body>
</html>
