<!DOCTYPE html>
<html>
<head>
<title>VIP XAUUSD V14 CANDLE</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
body{background:#050505;color:#fff;font-family:Arial;margin:0;padding:10px}
.header{text-align:center;color:#00ff00;font-size:18px;font-weight:bold;padding:8px;border:2px solid #0f0;border-radius:8px;margin-bottom:8px}
.price-box{background:#111;border:2px solid #0ff;border-radius:10px;padding:10px;text-align:center;margin-bottom:8px}
.price{font-size:28px;color:#0ff;font-weight:bold}
canvas{background:#0a0a0a;border-radius:8px}
.tfs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0}
.tf-btn{padding:6px;background:#1a1a1a;border:1px solid #444;border-radius:5px;text-align:center;cursor:pointer;font-size:11px}
.tf-btn.active{border-color:#0f0;background:#003300;color:#0f0}
</style>
</head>
<body>

<div class="header">🔥 VIP CANDLE DASHBOARD V14 🔥</div>

<div class="price-box">
  <div>XAUUSD LIVE</div>
  <div class="price" id="price">Loading...</div>
</div>

<div class="tfs">
  <div class="tf-btn active" onclick="selectTF('M1')">M1</div>
  <div class="tf-btn" onclick="selectTF('M5')">M5</div>
  <div class="tf-btn" onclick="selectTF('M15')">M15</div>
  <div class="tf-btn" onclick="selectTF('H1')">H1</div>
</div>

<canvas id="chart" height="200"></canvas>

<script>
const API_KEY = "da7er8pr01qj8fm6jrpgda7er8pr01qj8fm6jrq0";
let currentTF = "M1";
let chart;

async function getPrice(){
  let res = await fetch(`https://finnhub.io/api/v1/quote?symbol=OANDA:XAU_USD&token=${API_KEY}`);
  let data = await res.json();
  document.getElementById("price").innerText = data.c.toFixed(2);
}

function selectTF(tf){
  currentTF = tf;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  drawChart(); // TF بدلتے ہی Candle بھی بدل جائے گی
}

function drawChart(){
  const ctx = document.getElementById('chart');
  // Demo Data - Real میں یہاں API سے Candle Data آئے گا
  let labels = ['1','2','3','4','5','6','7','8'];
  let candleData = [
    {o:4610,h:4615,l:4608,c:4613},
    {o:4613,h:4618,l:4611,c:4616},
    {o:4616,h:4617,l:4610,c:4612},
    {o:4612,h:4614,l:4609,c:4613},
    {o:4613,h:4619,l:4612,c:4618},
    {o:4618,h:4620,l:4615,c:4616},
    {o:4616,h:4618,l:4613,c:4617},
    {o:4617,h:4621,l:4616,c:4620}
  ];
  
  if(chart) chart.destroy();
  
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: currentTF + ' Candle',
        data: candleData.map(d=>d.c),
        backgroundColor: candleData.map(d=>d.c>d.o?'#00ff00':'#ff0000')
      }]
    },
    options: {
      plugins: {
        annotation: {
          annotations: {
            label1: {type: 'label', xValue: 2, yValue: 4618, content: ['FVG'], color: 'yellow'}
          }
        }
      }
    }
  });
}

getPrice();
setInterval(getPrice, 5000);
drawChart();
</script>
</body>
</html>
